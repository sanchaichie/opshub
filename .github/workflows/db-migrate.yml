# The ONLY path for schema changes to reach production.
#
# Runs when migrations land on main, and waits for a manual approval on the
# "production" environment (Settings → Environments → production → Required
# reviewers). It applies new migrations only; it never resets anything.
name: Deploy migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
