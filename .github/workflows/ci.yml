name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run

  database:
    name: Migrations + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Starts a throwaway local Postgres, applies every migration + seed.sql.
      - run: supabase db start
      - run: supabase test db
      # Fails if a migration changed the schema but the committed types are stale.
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u shared/types/database.types.ts /tmp/database.types.ts
